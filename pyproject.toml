[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "triangulax"
dynamic = ["version"]
description = "JAX-compatible triangular meshes and triangular-mesh-based simulations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Nikolas Claussen", email = "nhclaussen@gmail.com"}]
keywords = ['jax', 'geometry-processing', 'triangular-mesh', 'half-edge', 'differentiable-simulation', 'computational-geometry']
classifiers = ["Natural Language :: English",
               "Intended Audience :: Developers",
               "Intended Audience :: Science/Research",
               "Topic :: Scientific/Engineering :: Mathematics",
               "Topic :: Scientific/Engineering :: Physics",
               "Development Status :: 3 - Alpha",
               "Programming Language :: Python :: 3",
               "Programming Language :: Python :: 3 :: Only",
               "Programming Language :: Python :: 3.10",
               "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12",]
dependencies = [
    "numpy",
    "jax",
    "jaxlib",
    "jaxtyping",
    "scipy",
    "libigl",
    "matplotlib",
]

[project.optional-dependencies]
tutorials = ["tqdm", "diffrax", "equinox", "optimistix", "orbax-checkpoint", "optax", "lineax", "jupyter"]

[project.urls]
Repository = "https://github.com/nikolas-claussen/triangulax"
Documentation = "https://nikolas-claussen.github.io/triangulax"

[project.entry-points.nbdev]
triangulax = "triangulax._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "triangulax.__version__"}

[tool.setuptools.packages.find]
include = ["triangulax"]

[tool.nbdev]
custom_sidebar = false

[tool.ruff.lint]
ignore = ["F722"]
